<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Maplair debug page - Control Layers</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
		<link rel="stylesheet" href="../../dist/maplair.css" />
		<link rel="stylesheet" href="../css/screen.css" />
		<script type="importmap">
			{
				"imports": {
					"maplair": "../../dist/maplair-src.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="map"></div>
		<style>
			.grayscale-tile {
				filter: grayscale(1);
			}
		</style>
		<script type="module">
			import {MaplairMap, TileLayer, LayersControl, Circle, Polygon, GeoJSON} from 'maplair';

			class GrayscaleTileLayer extends TileLayer {
				createTile(coords, done) {
					const element = super.createTile(coords, done);
					element.classList.add('grayscale-tile');
					return element;
				}
			}

			const map = new MaplairMap('map').setView([50.5, 0], 5);
			const tileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
			const regularTiles = new TileLayer(tileUrl).addTo(map);
			const blackAndWhiteTiles = new GrayscaleTileLayer(tileUrl);

			new LayersControl({
				'OSM': regularTiles,
				'OSM BW': blackAndWhiteTiles
			}, {
				'Circle': new Circle([53, 4], {radius: 111111}).addTo(map),
				'Polygon': new Polygon([[48, -3], [50, -4], [52, 4]]),
				'GeoJSON': new GeoJSON({
					type: 'Polygon',
					coordinates: [[
						[5.4931640625, 51.781435604431195],
						[0.9008789062499999, 53.35710874569601],
						[-2.30712890625, 51.795027225829145],
						[2.8125, 49.109837790524416],
						[5.4931640625, 51.781435604431195]
					]]
				}),
			}, {
				collapsed: false
			}).addTo(map);

			new LayersControl({
				'Tiles (OSM)': regularTiles,
				'Tiles (OSM <i>grayscale</i>)': blackAndWhiteTiles
			}, {
				'Shapes (Circle)': new Circle([46, 10], {radius: 111111}),
				'Shapes (Polygon)': new Polygon([[44, -3], [46, -4], [47, 4]]),
				'Other': new Circle([42, 0], {radius: 111111})
			}, {
				position: 'bottomleft',
				inline: true,
				groupBy(name) {
					const [, group, label] = /^([^<>()]+) \((.+)\)$/.exec(name) ?? [];
					return group ? {group: `${group}:`, label} : undefined;
				}
			}).addTo(map);

			new LayersControl({}, {
				'Small circle': new Circle([50, -8], {radius: 55555})
			}, {
				position: 'topleft',
				toggleContent: '&#x2630;'
			}).addTo(map);

			map.on('baselayerchange overlayadd overlayremove', (e) => {
				console.log(e.type, e.name, e.originalEvent ? 'by the user' : 'by code');
			});
		</script>
	</body>
</html>
