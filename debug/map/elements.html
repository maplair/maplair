<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Maplair debug page - Web components</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="../../dist/maplair.css" />
		<script type="module" src="../../dist/maplair-elements-src.js"></script>
		<style>
			body {
				font: 14px/1.4 sans-serif;
				max-width: 820px;
			}
			maplair-map {
				height: 500px;
			}
		</style>
	</head>
	<body>
		<h1>A map in HTML</h1>

		<maplair-map id="map" center="47.26,11.39" zoom="11" reflect-view>
			<p>The map needs JavaScript.</p>

			<maplair-tile-layer provider="osm" name="OpenStreetMap" base></maplair-tile-layer>
			<maplair-tile-layer provider="opentopomap" name="OpenTopoMap" base></maplair-tile-layer>

			<maplair-marker latlng="47.2692,11.4041" name="Innsbruck">
				<maplair-popup open><b>Innsbruck</b><br>Capital of the Alps</maplair-popup>
			</maplair-marker>

			<maplair-marker latlng="47.3078,11.3797">
				<maplair-svg-icon color="#2a7ab0" glyph="⛰"></maplair-svg-icon>
				<maplair-tooltip permanent direction="right">Hafelekar</maplair-tooltip>
			</maplair-marker>

			<maplair-circle latlng="47.2266,11.3378" radius="1500" color="#c0392b" name="Circle"></maplair-circle>
			<maplair-polygon latlngs="47.30,11.30 47.32,11.36 47.29,11.40" color="#8e44ad" name="Polygon">
				<maplair-popup>A polygon</maplair-popup>
			</maplair-polygon>

			<maplair-geojson name="Huts" tooltip="{name} ({ele} m)">
				<script type="application/geo+json">
					{"type": "FeatureCollection", "features": [
						{"type": "Feature", "properties": {"name": "Arzler Alm", "ele": 1067}, "geometry": {"type": "Point", "coordinates": [11.4248, 47.2905]}},
						{"type": "Feature", "properties": {"name": "Höttinger Alm", "ele": 1487}, "geometry": {"type": "Point", "coordinates": [11.3802, 47.2985]}},
						{"type": "Feature", "properties": {"name": "Pfeishütte", "ele": 1922}, "geometry": {"type": "Point", "coordinates": [11.4498, 47.3361]}}
					]}
				</script>
			</maplair-geojson>

			<maplair-scale-control></maplair-scale-control>
			<maplair-layers-control collapsed="false"></maplair-layers-control>
			<maplair-fullscreen-control></maplair-fullscreen-control>
			<maplair-text-control position="topright"><b>Maplair</b> web components</maplair-text-control>
			<maplair-context-menu>
				<button>Show coordinates</button>
			</maplair-context-menu>
		</maplair-map>

		<p>View: <output id="view"></output></p>

		<h2>A location picker</h2>
		<form id="form">
			<maplair-map name="location" pick required center="47.26,11.39" zoom="9" style="height: 300px">
				<maplair-tile-layer provider="osm"></maplair-tile-layer>
			</maplair-map>
			<button>Submit</button> <output id="submitted"></output>
		</form>

		<script type="module">
			const mapElement = /** @type {HTMLElement} */ (document.querySelector('#map'));
			const view = /** @type {HTMLOutputElement} */ (document.getElementById('view'));
			mapElement.addEventListener('maplair-moveend', () => {
				view.value = `${mapElement.getAttribute('center')} @ ${mapElement.getAttribute('zoom')}`;
			});
			mapElement.addEventListener('maplair-select', (e) => {
				alert(/** @type {CustomEvent} */ (e).detail.latlng.toString());
			});
			const form = /** @type {HTMLFormElement} */ (document.getElementById('form'));
			form.addEventListener('submit', (e) => {
				e.preventDefault();
				/** @type {HTMLOutputElement} */ (document.getElementById('submitted')).value = `${new FormData(form).get('location')}`;
			});
		</script>
	</body>
</html>
