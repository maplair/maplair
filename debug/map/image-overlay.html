<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Maplair debug page - Image Overlay</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
		<link rel="stylesheet" href="../../dist/maplair.css" />
		<link rel="stylesheet" href="../css/screen.css" />
		<script type="importmap">
			{
				"imports": {
					"maplair": "../../dist/maplair-src.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			import {TileLayer, LatLng, MaplairMap, LatLngBounds, ImageOverlay} from 'maplair';

			const osmUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
			const osmAttrib = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
			const osm = new TileLayer(osmUrl, {maxZoom: 18, attribution: osmAttrib});

			const map = new MaplairMap('map');
			map.addLayer(osm);

			const	bounds = new LatLngBounds(
				new LatLng(40.71222, -74.22655),
				new LatLng(40.77394, -74.12544)
			);

			map.fitBounds(bounds);

			const overlay = new ImageOverlay('https://maps.lib.utexas.edu/maps/historical/newark_nj_1922.jpg', bounds, {
				opacity: 0.5,
				interactive: true,
				attribution: '© A.B.B Corp.'
			});

			map.addLayer(overlay);

			overlay.on('dblclick', () => {
				console.log('Double click on image.');
			});
		</script>
	</body>
</html>
