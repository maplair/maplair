	<body>
		<div id="map"></div>
		<p>Hover over a cluster to see the bounds of its markers, click a cluster to zoom to those bounds.</p>
		<script type="module">
			import {MaplairMap, Marker, TileLayer} from 'maplair';
			import {MarkerClusterGroup} from 'maplair/markercluster';

			const tiles = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 18,
				attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Points © 2012 LINZ'
			});

			const map = new MaplairMap('map', {center: [-37.82, 175.24], zoom: 13, layers: [tiles]});

			const markers = new MarkerClusterGroup();
			for (const [lat, lng, title] of addressPoints) {
				markers.addLayer(new Marker([lat, lng], {title}).bindPopup(title));
			}
			map.addLayer(markers);

			markers.on('clusterclick', e => console.log('clusterclick', e.layer.getChildCount()));
		</script>
