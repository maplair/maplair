<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Maplair debug page - Blanket</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0" />
		<link rel="stylesheet" href="../../dist/maplair.css" />
		<link rel="stylesheet" href="../css/mobile.css" />
		<script type="importmap">
			{
				"imports": {
					"maplair": "../../dist/maplair-src.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">
			import {TileLayer, MaplairMap, LatLng, BlanketOverlay, Canvas, SVG, CircleMarker} from 'maplair';

			const osm = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18});
			const map = new MaplairMap('map', {
				center: new LatLng(0, 0),
				zoom: 1,
				layers: [osm]
			});

			class DebugBlanket extends BlanketOverlay {
				_initContainer() {
					const container = this._container = document.createElement('div');
					container.style.border = '2px solid black';

					container.style.display = 'flex';
					container.style.justifyContent = 'center';
					container.style.alignItems = 'center';
				}

				_onSettled() {
					// the state of the overlay, private members of BlanketOverlay
					const self = /** @type {any} */ (this);
					self._container.innerHTML = `
					lat: ${self._center.lat.toFixed(6)}<br>
					lng: ${self._center.lng.toFixed(6)}<br>
					zoom: ${self._zoom}<br>
					map bounds: <br>${self._map.getBounds().toBBoxString().split(',').map(n => Number(n).toFixed(6)).join('<br>')}<br>
					px bounds: ${self._bounds.min}, ${self._bounds.max}`;
				}
			}

			new DebugBlanket({
				padding: -0.1,
				continuous: true
			}).addTo(map);

			const canvas = new Canvas({
				padding: -0.1,
			}).addTo(map);
			/** @type {any} */ (canvas)._container.style.border = '2px solid red';
			new CircleMarker([40.5, -3.6], {radius: 20, color: 'red', renderer: canvas}).addTo(map);

			const svg = new SVG({
				padding: -0.1,
			}).addTo(map);
			/** @type {any} */ (svg)._container.style.border = '2px solid blue';
			new CircleMarker([63.4, 10.4], {radius: 20, color: 'blue', renderer: svg}).addTo(map);
			</script>
	</body>
</html>
