<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Grid Coordinates Example - Maplair</title>
	
	<link rel="icon" type="image/svg+xml" href="docs/images/favicon.svg" />
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

	<link rel="stylesheet" href="/dist/maplair.css"/>
	<script type="importmap">
		{
			"imports": {
				"maplair": "/dist/maplair.js"
			}
		}
	</script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.maplair-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	
</head>
<body>

<div id='map'></div>

<script type="module">
	import {MaplairMap, GridLayer} from 'maplair';

	const map = new MaplairMap('map', {
		center: [0, 0],
		zoom: 0
	});

	class DebugCoordsGridLayer extends GridLayer {
		createTile(coords, done) {
			const tile = document.createElement('div');
			tile.innerHTML = [coords.x, coords.y, coords.z].join(', ');
			tile.style.outline = '1px solid red';

			setTimeout(() => {
				done(null, tile); // Syntax is 'done(error, tile)'
			}, 500 + Math.random() * 1500);

			return tile;
		}
	}
	
	const debugCoordsGrid = new DebugCoordsGridLayer();
	map.addLayer(debugCoordsGrid);
</script>



</body>
</html>
