<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Web Components Form Example - Maplair</title>
	
	<link rel="icon" type="image/svg+xml" href="docs/images/favicon.svg" />
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

	<link rel="stylesheet" href="/dist/maplair.css"/>
	<script type="importmap">
		{
			"imports": {
				"maplair": "/dist/maplair.js"
			}
		}
	</script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.maplair-container {
			height: 100%;
		}
	</style>

	<style>form { height: 100%; display: flex; flex-direction: column; } maplair-map { flex: 1; } p { margin: 8px; font: 14px sans-serif; }</style>
</head>
<body>



<script type="module" src="/dist/maplair-elements.js"></script>

<form>
	<maplair-map name="location" pick required center="47.27,11.39" zoom="10" aria-label="Location of the meeting point">
		<maplair-tile-layer provider="osm"></maplair-tile-layer>
	</maplair-map>
	<p><button>Send</button> <output></output></p>
</form>

<script type="module">
	const form = document.querySelector('form');
	form.addEventListener('submit', (e) => {
		e.preventDefault();
		form.querySelector('output').value = `location=${new FormData(form).get('location')}`;
	});
</script>


</body>
</html>
