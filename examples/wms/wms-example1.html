<body>

<div id='map'></div>

<script type="module">
	import {MaplairMap, CRS, WMSTileLayer} from 'maplair';

	const map = new MaplairMap('map', {
		center: [-17, -67],
		zoom: 3
	});

	const wmsLayer = new WMSTileLayer('http://ows.mundialis.de/services/service?', {
		layers: 'TOPO-OSM-WMS'
	}).addTo(map);
</script>
