<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>SimpleCRS Example - Maplair</title>
	
	<link rel="icon" type="image/svg+xml" href="docs/images/favicon.svg" />
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

	<link rel="stylesheet" href="/dist/maplair.css"/>
	<script type="importmap">
		{
			"imports": {
				"maplair": "/dist/maplair.js"
			}
		}
	</script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.maplair-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	
</head>
<body>

<div id='map'></div>

<script type="module">
	import {MaplairMap, SimpleCRS, ImageOverlay, LatLng, Marker} from 'maplair';

	const map = new MaplairMap('map', {
		crs: SimpleCRS,
		minZoom: -3
	});

	const bounds = [[-26.5, -25], [1021.5, 1023]];
	const image = new ImageOverlay('uqm_map_full.png', bounds).addTo(map);

	const sol = new LatLng([145, 175]);
	const marker = new Marker(sol).addTo(map);

	map.setView([70, 120], 1);
</script>



</body>
</html>
