<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Custom Icons Example - Maplair</title>
	
	<link rel="icon" type="image/svg+xml" href="docs/images/favicon.svg" />
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

	<link rel="stylesheet" href="/dist/maplair.css"/>
	<script type="importmap">
		{
			"imports": {
				"maplair": "/dist/maplair.js"
			}
		}
	</script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.maplair-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
	</style>

	
</head>
<body>

<div id='map'></div>

<script type="module">
	import {MaplairMap, TileLayer, Marker, Icon} from 'maplair';
	const map = new MaplairMap('map').setView([51.5, -0.09], 13);

	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(map);

	class LeafIcon extends Icon {
		static {
			this.setDefaultOptions({
				shadowUrl: 'leaf-shadow.png',
				iconSize:     [38, 95],
				shadowSize:   [50, 64],
				iconAnchor:   [22, 94],
				shadowAnchor: [4, 62],
				popupAnchor:  [-3, -76]
			});
		}
	}

	const greenIcon = new LeafIcon({iconUrl: 'leaf-green.png'});
	const redIcon = new LeafIcon({iconUrl: 'leaf-red.png'});
	const orangeIcon = new LeafIcon({iconUrl: 'leaf-orange.png'});

	const mGreen = new Marker([51.5, -0.09], {icon: greenIcon}).bindPopup('I am a green leaf.').addTo(map);
	const mRed = new Marker([51.495, -0.083], {icon: redIcon}).bindPopup('I am a red leaf.').addTo(map);
	const mOrange = new Marker([51.49, -0.1], {icon: orangeIcon}).bindPopup('I am an orange leaf.').addTo(map);
</script>



</body>
</html>
