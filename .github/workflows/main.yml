name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  NODE_VERSION: 24
  PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ./docs

      - working-directory: ./docs
        run: bundle exec jekyll build --strict_front_matter

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      size: ${{ steps.size.outputs.summary }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - run: vp lint
      - run: vp pack
      - run: node ./spec/dist.js
      - run: node ./spec/ssr/ssr_node.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno run ./spec/ssr/ssr_deno.js

      # copy the script so it survives the base checkout
      - run: mv dist dist-head && cp build/size.js "$RUNNER_TEMP/"

      - name: Build base
        if: env.BASE_SHA && !startsWith(env.BASE_SHA, '0000000')
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" && vp install && vp pack && mv dist dist-base

      - id: size
        run: node "$RUNNER_TEMP/size.js" dist-base dist-head >> "$GITHUB_OUTPUT"

  size-report:
    needs: check
    if: always() && needs.check.outputs.size
    name: 'size: ${{ needs.check.outputs.size }}'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'

  # separate jobs rather than a matrix so that they show up flat in the run summary
  test-chromium:
    name: test (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: chromium
    steps: &test-steps
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: vp exec playwright install "$TEST_BROWSER"
        shell: bash

      - run: vp test run

  test-firefox:
    name: test (firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: firefox
    steps: *test-steps

  test-webkit:
    name: test (webkit)
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      TEST_BROWSER: webkit
    steps: *test-steps

  test-windows:
    name: test (chromium, windows)
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      TEST_BROWSER: chromium
    steps: *test-steps

  publish-artifacts:
    permissions:
      contents: write
    if: github.repository_owner == 'maplair' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: dev-snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - run: vp pack

      - name: Compress artifacts
        working-directory: dist
        run: zip -r maplair.zip . ../CHANGELOG.md ../LICENSE ../README.md

      - name: Publish development snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev > /dev/null 2>&1 ||
            gh release create dev --prerelease --title "Development snapshot" --target "$GITHUB_SHA" --notes ""
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release edit dev --notes "Latest build of \`main\` at $GITHUB_SHA ($(date -u +'%Y-%m-%d %H:%M UTC')), updated automatically on every push. Not a stable release."
          # the files of dist, not its directories
          find dist -maxdepth 1 -type f -exec gh release upload dev --clobber {} +
          # drop assets the build no longer produces
          for name in $(gh release view dev --json assets -q '.assets[].name'); do
            [ -e "dist/$name" ] || gh release delete-asset dev "$name" --yes
          done

  # Stages the release on npm (trusted publishing via OIDC, no token), where a
  # maintainer approves it with 2FA: `pnpm stage approve`
  publish-npm:
    if: github.repository_owner == 'maplair' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-docs, check, test-chromium, test-firefox, test-webkit, test-windows]
    permissions:
      contents: read
      id-token: write # for npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false # no caches in release builds

      - run: vp pack

      # the tag is checked out on a detached HEAD, hence --no-git-checks
      - name: Stage release on npm
        run: |
          TAG=$(echo $GITHUB_REF_NAME | grep -oP '^v\d+\.\d+\.\d+-?\K(\w+)?')
          vp pm stage publish --tag ${TAG:-latest} -- --no-git-checks
