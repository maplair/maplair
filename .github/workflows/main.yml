name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  NODE_VERSION: 24
jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ./docs

      - working-directory: ./docs
        run: bundle exec jekyll build --strict_front_matter

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - run: vp lint

  test-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - run: vp pack
      - run: node ./spec/ssr/ssr_node.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno run ./spec/ssr/ssr_deno.js

  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
          - project: firefox
          - project: chromium-retina
          - project: chromium
            os: windows-latest
          - project: webkit
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: vp exec playwright install ${{ matrix.project == 'chromium-retina' && 'chromium' || matrix.project }}

      - name: Run tests on ${{ matrix.project }}
        run: vp test run --project=${{ matrix.project }}

      - name: Run tests on ${{ matrix.project }} with touch
        run: vp test run --project=${{ matrix.project }}
        env:
          VITE_TOUCH: '1'

  publish-artifacts:
    permissions:
      contents: write
    if: github.repository_owner == 'maplair' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - run: vp pack

      - name: Compress artifacts
        working-directory: dist
        run: zip -r maplair.zip . ../CHANGELOG.md ../LICENSE ../README.md

      - name: Publish development snapshot
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Development snapshot
          prerelease: true
          files: dist/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stages the release on npm (trusted publishing via OIDC, no token), where a
  # maintainer approves it with 2FA: `pnpm stage approve`
  publish-npm:
    if: github.repository_owner == 'maplair' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-docs, lint, test, test-ssr]
    permissions:
      contents: read
      id-token: write # for npm trusted publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false # no caches in release builds

      - run: vp pack

      # the tag is checked out on a detached HEAD, hence --no-git-checks
      - name: Stage release on npm
        run: |
          TAG=$(echo $GITHUB_REF_NAME | grep -oP '^v\d+\.\d+\.\d+-?\K(\w+)?')
          vp pm stage publish --tag ${TAG:-latest} -- --no-git-checks
