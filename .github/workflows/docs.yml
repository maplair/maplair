name: Docs
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Build Maplair
        run: vp pack

      - name: Generate API reference
        run: vp run docs

      # the docs site loads the latest build from /dist/
      - name: Copy build into docs
        run: cp -r dist docs/dist

      - name: Build site
        run: node ./build/site.js

      - name: Push site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          cname: maplair.org
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
